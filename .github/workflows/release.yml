name: Release

# One-time setup required before the first run: register this repo + workflow as a
# Trusted Publisher on PyPI (environment "pypi") and TestPyPI (environment
# "testpypi"), and create both environments in GitHub Settings → Environments
# (add required reviewers on "pypi" if desired). Until then, a publish job fails
# cleanly at the OIDC token exchange; the built artifact stays downloadable from
# the build job and the job can simply be re-run after the setup is done.

on:
  release:
    types: [published]
  workflow_dispatch:   # dry-run to TestPyPI

# Least privilege for the build job (which runs third-party build backends);
# the publish jobs override this with their own id-token: write blocks, and the
# man-pages job overrides it with contents: write, which gh release upload needs.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - run: |
          uv build
          uvx twine check dist/*
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1

  # contents: write lets gh release upload attach files to the release. The
  # workflow default stays read so no other job can modify the repository.
  man-pages:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.13"
      - run: |
          uv sync --locked --group docs --extra rdf --extra xml --extra dot --extra graph
          uv run --no-sync sphinx-build -W -n -b man docs docs/_build/man
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" docs/_build/man/prov-convert.1 docs/_build/man/prov-compare.1 \
            --clobber --repo "$GITHUB_REPOSITORY"
